name: scaffold_ui
description: "The fastest way to scaffold services in your Nylo project! Auth & IAP integrations for Supabase, Firebase, Laravel, RevenueCat, Superwall and more."
version: 2.0.4
homepage: https://nylo.dev
repository: https://github.com/nylo-core/scaffold_ui
issue_tracker: https://github.com/nylo-core/scaffold_ui/issues
documentation: https://github.com/nylo-core/scaffold_ui
funding:
  - https://github.com/sponsors/agordn52
topics:
  - laravel
  - supabase
  - revenuecat
  - superwall
  - firebase

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  args: ^2.7.0
  nylo_support: ^7.29.0
  flutter:
    sdk: flutter

dev_dependencies:
  vibe_check: ^1.0.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

screenshots:
  - description: The package logo.
    path: screenshots/logo.png

flutter:
  uses-material-design: true
  assets:
    - images/sonoran_desert_1.jpg
    - images/sonoran_desert_2.png
    - images/sonoran_desert_3.jpg